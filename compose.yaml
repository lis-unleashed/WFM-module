# PostgreSQL 16 for local development and tests. `make check` and `make db`
# start it if nothing is already listening on localhost:5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres # local only
    ports:
      - "127.0.0.1:5432:5432" # not reachable from other machines
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
