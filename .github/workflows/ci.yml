name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      WFM_ENV: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the migration guard compares with origin/main

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install psql if the runner doesn't have it
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - run: make check
